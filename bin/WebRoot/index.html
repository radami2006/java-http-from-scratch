<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Java HTTP Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 2em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: baseline;
            gap: 2em;
        }
        h1 {
            color: #0069d9;
        }
        p {
            font-size: 1.1em;
        }
        .info {
            padding: 1em;
            background: #e9ecef;
            border-radius: 8px;
            display: inline-block;
        }
        .logo-container {
            max-height: 200px;
            max-width: 500px;
        }
        .image {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
<h1>Welcome to My Simple Java HTTP Server</h1>
<p>This page is being served directly from your local server.</p>
<div class="info">
    <p>If you can see this, your server is working correctly.</p>
</div>
<div class="logo-container">
    <img src="/logo.png" alt="Example image to demonstrate image serving" class="image"/>
</div>
</body>
</html>
